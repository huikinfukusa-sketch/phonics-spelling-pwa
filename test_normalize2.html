<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Normalize Detailed Failures</title></head>
<body>
<pre id="output"></pre>
<script>
function normalizeAnswer(str) {
    str = String(str).normalize('NFKC');
    str = str.replace(/[\u0300-\u036f]/g, '');
    str = str.replace(/[\u200b-\u200d\ufeff]/g, '');
    str = str.replace(/\u00a0/g, ' ');
    str = str.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'");
    return str;
}

const words = ["quiet","hello","computer","Apple","beautiful"];
let failOutput = '';

for (const raw_word of words) {
    const cw = raw_word.toLowerCase().trim();
    
    const tests = [
        ['lowercase', cw],
        ['UPPERCASE', cw.toUpperCase()],
        ['TitleCase', cw.charAt(0).toUpperCase() + cw.slice(1)],
        ['Fullwidth', cw.split('').map(c => {
            if (c >= 'a' && c <= 'z') return String.fromCharCode(c.charCodeAt(0) + 0xFF01 - 97);
            if (c >= 'A' && c <= 'Z') return String.fromCharCode(c.charCodeAt(0) + 0xFF01 - 65);
            return c;
        }).join('')],
        ['ZeroWidth', '\u200b' + cw],
        ['NBSP_space', cw.replace(/\s+/g, '\u00a0')],
        ['TrailingSpace', cw + ' '],
        ['LeadingSpace', ' ' + cw],
        ['BothSpaces', '  ' + cw + '  '],
        ['MixedFullWidthUpper', cw.toUpperCase().split('').map(c => {
            if (c >= 'A' && c <= 'Z') return String.fromCharCode(c.charCodeAt(0) + 0xFF01 - 65);
            return c;
        }).join('')],
    ];
    
    for (const [name, v] of tests) {
        const ni = normalizeAnswer(v);
        const nt = normalizeAnswer(cw);
        
        // Show character-by-character diff
        let diff = '';
        for (let i = 0; i < Math.max(ni.length, nt.length); i++) {
            const a = ni[i] || '<eof>';
            const b = nt[i] || '<eof>';
            if (a !== b) diff += `[${i}:${JSON.stringify(a)}≠${JSON.stringify(b)}]`;
        }
        
        const pass = ni === nt ? '✅' : '❌';
        failOutput += `${pass} ${raw_word.padEnd(12)} ${name.padEnd(24)} input_len=${v.length} norm_len=${ni.length}\n`;
        
        if (ni !== nt && diff) {
            failOutput += `   input: ${JSON.stringify(v.substring(0,30))}\n`;
            failOutput += `   normI: ${JSON.stringify(ni.substring(0,30))}\n`;
            failOutput += `   normT: ${JSON.stringify(nt.substring(0,30))}\n`;
            failOutput += `   diff:  ${diff}\n\n`;
        }
    }
}

document.getElementById('output').textContent = failOutput;
</script>
</body>
</html>
