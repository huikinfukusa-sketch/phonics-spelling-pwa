<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Regression Test - Detailed</title></head>
<body>
<pre id="output"></pre>
<script>
function normalizeAnswer(str) {
    str = String(str).normalize('NFKC');
    str = str.replace(/[\u0300-\u036f]/g, '');
    str = str.replace(/[\u200b-\u200d\ufeff]/g, '');
    str = str.replace(/\u00a0/g, ' ');
    str = str.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'");
    return str;
}

const testWords = [
    "quiet", "hello", "computer", "Apple", "beautiful",
    "banana", "different", "elephant", "Wednesday", "tomorrow",
    "library", "favourite", "necessary", "chocolate", "umbrella",
    "pencil", "school", "teacher", "morning", "happy",
    "letter", "window", "summer", "running", "beginning",
    "science", "friend", "because", "selfish", "happiness",
    "question", "squirrel", "yellow", "purple", "orange",
    "grape", "rainbow", "understand", "afternoon", "thousand",
    "strength", "pharmacy", "victory", "environment", "empty",
    "gymnasium", "aeroplane", "autumn", "psychology", "rhythm"
];

// Test each word with various input variants
let allPass = true;
let totalTests = 0;
let passTests = 0;
let failDetails = [];

for (const raw_word of testWords) {
    const clean_w = raw_word.toLowerCase().trim();
    
    // Variants to test
    const variants = [
        ['lowercase', clean_w],
        ['UPPERCASE', clean_w.toUpperCase()],
        ['TitleCase', clean_w.charAt(0).toUpperCase() + clean_w.slice(1)],
        ['Fullwidth', clean_w.split('').map(c => c.charCodeAt(0) >= 97 && c.charCodeAt(0) <= 122 
            ? String.fromCharCode(c.charCodeAt(0) + 0xFF01 - 97) : c).join('')],
        ['ZeroWidth', '\u200b' + clean_w],
        ['NBSP_space', clean_w.replace(/ /g, '\u00a0')],
        ['SmartQuotes', clean_w.replace(/q/g, '\u201c')],
    ];
    
    for (const [name, v] of variants) {
        totalTests++;
        const norm_input = normalizeAnswer(v);
        const norm_target = normalizeAnswer(clean_w);
        
        if (norm_input === norm_target) {
            passTests++;
        } else {
            allPass = false;
            if (failDetails.length < 50) {
                failDetails.push({ word: raw_word, variant: name, input_len: v.length, target_len: clean_w.length, input_hex: Array.from(v).slice(0,10).map(c => c.charCodeAt(0).toString(16)).join('-'), target_hex: Array.from(clean_w).slice(0,10).map(c => c.charCodeAt(0).toString(16)).join('-'), input_show: JSON.stringify(v.substring(0,20)), target_show: JSON.stringify(clean_w.substring(0,20)) });
            }
        }
    }
}

console.log(`Total tests: ${totalTests}`);
console.log(`Passed: ${passTests}`);
console.log(`Failed: ${totalTests - passTests}`);

if (failDetails.length > 0) {
    console.log('\nFAILURES:');
    failDetails.forEach(f => {
        console.log(`  ${f.word} (${f.variant}): input[${f.input_len}]="${f.input_show}" → "${JSON.stringify(normalizeAnswer(eval(f.input_show)))}" vs target[${f.target_len}]="${f.target_show}" → "${normalizeAnswer(f.target_show)}"`);
    });
}

document.getElementById('output').textContent = 
    `TOTAL TESTS: ${totalTests}\nPASSED: ${passTests}\nFAILED: ${totalTests - passTests}\n\nDetailed results in browser console (F12 -> Console tab).`;
</script>
</body>
</html>
