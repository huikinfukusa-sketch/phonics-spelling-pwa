<script>
// ======================================================================
//  HK PRIMARY SCHOOL P2–P6 COMMON DICTATION WORDS

// ======================================================================

    "vegetable","cucumber","tomato","potato","cabbage","lettuce","spinach","broccoli","cauliflower","mushroom",

    "whistle","castle","hasten","soften","thistle","glisten","fasten",
    "business","busy","bought","caught","taught","through","though","thorough"
  ]

// Realistic input variants a HK kid / iPad Chinese IME can actually produce
function makeVariants(w) {
  const lower = w.toLowerCase();
  const toFullwidth = s => s.split('').map(c => {
    const n = c.charCodeAt(0);
    return (n >= 97 && n <= 122) ? String.fromCharCode(n + 0xFEE0)
         : (n >= 65 && n <= 90)  ? String.fromCharCode(n + 0xFEE0) : c;
  }).join('');
  return [
    ["正常小階",      lower],
    ["全大階 CAPS",   lower.toUpperCase()],
    ["首字母大階",    lower.charAt(0).toUpperCase() + lower.slice(1)],
    ["全形 IME",      toFullwidth(lower)],
    ["前面有空格",    " " + lower],
    ["後面有空格",    lower + " "],
    ["母音帶重音符",  lower.split('').map(c => "aeiou".includes(c) ? c + "\u0301" : c).join("")],
    ["零寬字元",      lower.split("").join("\u200b")],
    ["彎引號",        "\u201c" + lower + "\u201d"],
    ["NBSP 空格",     "\u00a0" + lower + "\u00a0"],
    ["全形空格",      lower + "\u3000"],
  ];
}

// Authoritative syllable counts (British English, as taught in HK primary schools).
// This is the check that catches a *quality* regression: reassembly can stay
// perfect while the split boundaries silently get worse.
const EXPECTED_SYLLABLES = {"cat": 1, "dog": 1, "sun": 1, "moon": 1, "star": 1, "book": 1, "pen": 1, "bag": 1, "cup": 1, "hat": 1, "red": 1, "blue": 1, "green": 1, "big": 1, "small": 1, "run": 1, "jump": 1, "eat": 1, "drink": 1, "sleep": 1, "mother": 2, "father": 2, "sister": 2, "brother": 2, "baby": 2, "apple": 2, "banana": 3, "egg": 1, "milk": 1, "bread": 1, "house": 1, "door": 1, "window": 2, "table": 2, "chair": 1, "bed": 1, "tree": 1, "flower": 2, "bird": 1, "fish": 1, "hand": 1, "foot": 1, "eye": 1, "ear": 1, "nose": 1, "mouth": 1, "head": 1, "leg": 1, "arm": 1, "face": 1, "one": 1, "two": 1, "three": 1, "four": 1, "five": 1, "six": 1, "seven": 2, "eight": 1, "nine": 1, "ten": 1, "boy": 1, "girl": 1, "man": 1, "woman": 2, "friend": 1, "teacher": 2, "school": 1, "class": 1, "desk": 1, "play": 1, "happy": 2, "sad": 1, "angry": 2, "tired": 1, "hungry": 2, "thirsty": 2, "cold": 1, "hot": 1, "warm": 1, "cool": 1, "morning": 2, "afternoon": 3, "evening": 2, "night": 1, "today": 2, "tomorrow": 3, "yesterday": 3, "week": 1, "month": 1, "year": 1, "breakfast": 2, "lunch": 1, "dinner": 2, "orange": 2, "grape": 1, "mango": 2, "lemon": 2, "cherry": 2, "peach": 1, "melon": 2, "chicken": 2, "rice": 1, "noodle": 2, "soup": 1, "cake": 1, "candy": 2, "chocolate": 3, "biscuit": 2, "juice": 1, "water": 2, "garden": 2, "park": 1, "zoo": 1, "farm": 1, "beach": 1, "mountain": 2, "river": 2, "lake": 1, "sea": 1, "sky": 1, "lion": 2, "tiger": 2, "elephant": 3, "monkey": 2, "rabbit": 2, "horse": 1, "sheep": 1, "cow": 1, "pig": 1, "duck": 1, "family": 3, "parent": 2, "uncle": 2, "aunt": 1, "cousin": 2, "grandma": 2, "grandpa": 2, "neighbour": 2, "people": 2, "child": 1, "walk": 1, "talk": 1, "sing": 1, "dance": 1, "draw": 1, "write": 1, "read": 1, "listen": 2, "watch": 1, "help": 1, "beautiful": 3, "wonderful": 3, "careful": 2, "helpful": 2, "useful": 2, "powerful": 3, "colourful": 3, "peaceful": 2, "thankful": 2, "cheerful": 2, "weather": 2, "season": 2, "spring": 1, "summer": 2, "autumn": 2, "winter": 2, "sunny": 2, "cloudy": 2, "rainy": 2, "windy": 2, "kitchen": 2, "bathroom": 2, "bedroom": 2, "garage": 2, "balcony": 3, "ceiling": 2, "carpet": 2, "curtain": 2, "homework": 2, "lesson": 2, "subject": 2, "english": 2, "chinese": 2, "maths": 1, "science": 2, "music": 2, "library": 3, "museum": 3, "hospital": 3, "restaurant": 3, "supermarket": 4, "airport": 2, "station": 2, "cinema": 3, "theatre": 2, "stadium": 3, "police": 2, "doctor": 2, "nurse": 1, "driver": 2, "pilot": 2, "farmer": 2, "worker": 2, "singer": 2, "player": 2, "artist": 2, "because": 2, "although": 2, "however": 3, "therefore": 2, "meanwhile": 2, "suddenly": 3, "finally": 3, "actually": 4, "especially": 4, "probably": 3, "different": 3, "important": 3, "interesting": 4, "difficult": 3, "dangerous": 3, "expensive": 3, "delicious": 3, "necessary": 4, "possible": 3, "terrible": 3, "exercise": 3, "practice": 2, "holiday": 3, "journey": 2, "adventure": 3, "treasure": 2, "machine": 2, "language": 2, "knowledge": 2, "experience": 4, "environment": 4, "government": 3, "development": 4, "education": 4, "information": 4, "communication": 5, "transportation": 4, "population": 4, "celebration": 4, "competition": 4, "responsibility": 6, "opportunity": 5, "possibility": 5, "ability": 4, "activity": 4, "reality": 4, "society": 3, "community": 4, "security": 4, "quality": 3, "temperature": 4, "literature": 4, "agriculture": 4, "architecture": 4, "photograph": 3, "geography": 4, "biography": 4, "technology": 4, "psychology": 4, "philosophy": 4, "immediately": 5, "independent": 4, "intelligent": 4, "excellent": 3, "successful": 3, "confident": 3, "permanent": 3, "significant": 4, "traditional": 4, "international": 5, "guarantee": 3, "committee": 3, "occurrence": 3, "recommend": 3, "separate": 3, "definitely": 4, "embarrass": 3, "accommodation": 5, "conscience": 2, "february": 3, "behaviour": 3, "favourite": 3, "honour": 2, "labour": 2, "colour": 2, "humour": 2, "flavour": 2, "dictionary": 4, "vocabulary": 5, "grammar": 2, "sentence": 2, "paragraph": 3, "punctuation": 4, "alphabet": 3, "syllable": 3, "pronunciation": 5, "spelling": 2, "vegetable": 4, "cucumber": 3, "tomato": 3, "potato": 3, "cabbage": 2, "lettuce": 2, "spinach": 2, "broccoli": 3, "cauliflower": 4, "mushroom": 2, "straight": 1, "height": 1, "weight": 1, "freight": 1, "daughter": 2, "laughter": 2, "thought": 1, "brought": 1, "scissors": 2, "scene": 1, "schedule": 2, "scholar": 2, "scientist": 3, "conscious": 2, "rhythm": 2, "pneumonia": 3, "knee": 1, "knife": 1, "knock": 1, "know": 1, "knight": 1, "knit": 1, "knot": 1, "whistle": 2, "castle": 2, "hasten": 2, "soften": 2, "thistle": 2, "glisten": 2, "fasten": 2, "business": 2, "busy": 2, "bought": 1, "caught": 1, "taught": 1, "through": 1, "though": 1, "thorough": 2, "quiet": 2, "creature": 2, "idea": 3, "area": 3, "piano": 3, "radio": 3, "video": 3};

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed, i = a.length, j;
  while (i !== 0) {
    s = (s * 9301 + 49297) % 233280;
    j = Math.floor(s / 233280 * i); i--;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ======================================================================
//  Load the REAL app in a hidden iframe, then test against its functions
// ======================================================================
const frame = document.createElement('iframe');
frame.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px';
frame.src = '../index.html?test=' + Date.now();
document.body.appendChild(frame);

frame.addEventListener('load', () => {
  setTimeout(runTests, 800);   // let the SPA finish initialising
});

function setStatus(msg) { document.getElementById('status').innerHTML = msg; }

function runTests() {
  const W = frame.contentWindow;
  const need = ['normalizeAnswer', 'autoSplitSyllables', 'syllableGroupsForWord'];
  const missing = need.filter(fn => typeof W[fn] !== 'function');
  if (missing.length) {
    setStatus('❌ 無法取得 index.html 嘅函數：' + missing.join(', ') +
              '<br>（如果係用 file:// 開啟，瀏覽器會封鎖 iframe 存取。請改用 GitHub Pages 網址，' +
              '或者喺呢個資料夾起本地 server：python -m http.server）');
    return;
  }
  setStatus('<span class="spin">⏳</span> 正在測試 …');

  const words = [];
  const seen = new Set();
  Object.entries(WORD_GROUPS).forEach(([g, ws]) => ws.forEach(w => {
    const k = w.toLowerCase();
    if (!seen.has(k)) { seen.add(k); words.push({ g, w }); }
  }));

  const R = {
    normPass: 0, normFail: [],
    sylPass: 0,  sylFail: [],
    letPass: 0,  letFail: [],
    accPass: 0,  accFail: [],
    sgfwFallback: []
  };

  words.forEach(({ g, w }) => {
    // --- 1. normalizeAnswer across all realistic variants ---
    const target = W.normalizeAnswer(w);
    makeVariants(w).forEach(([label, variant]) => {
      const got = W.normalizeAnswer(variant);
      if (got === target) R.normPass++;
      else R.normFail.push({ g, w, label, got, target });
    });

    // --- 2. Syllable split must reassemble into the exact word ---
    //     (otherwise Blocks 關永遠拼唔完，Letters 關格子數都會錯)
    try {
      const syls = W.autoSplitSyllables(w);
      if (!Array.isArray(syls) || !syls.length) throw new Error('returned empty/not-array');
      const strip = s => String(s).toLowerCase().replace(/[^a-z]/g, '');
      if (strip(syls.join('')) === strip(w)) R.sylPass++;
      else R.sylFail.push({ g, w, syls, rejoined: strip(syls.join('')), expected: strip(w) });

      // syllable-COUNT accuracy against the curated table
      const expN = EXPECTED_SYLLABLES[w.toLowerCase()];
      if (expN !== undefined) {
        if (syls.length === expN) R.accPass++;
        else R.accFail.push({ g, w, syls, got: syls.length, exp: expN });
      }

      // syllableGroupsForWord must NOT silently fall back to the whole word
      const sgfw = W.syllableGroupsForWord({ word: w, syllables: syls });
      if (sgfw.length === 1 && sgfw[0] === w && syls.length > 1) {
        R.sgfxFallback = null; // placeholder
        R.sgfxFallbackUnused = true;
        R.sgfx = R.sgfx || [];
        R.sgfx.push({ g, w, syls });
      }
    } catch (e) {
      R.sylFail.push({ g, w, error: String(e.message || e).slice(0, 140) });
    }

    // --- 3. Letters 關：25 次隨機洗牌都要可以按順序拼返出嚟 ---
    const clean = w.toLowerCase().replace(/[^a-z]/g, '');
    if (clean) {
      let bad = 0;
      for (let run = 0; run < 25; run++) {
        const pool = seededShuffle(clean.split('').map(t => ({ t, used: false })), run + 7);
        let ans = '';
        for (let p = 0; p < clean.length; p++) {
          const k = pool.findIndex(x => !x.used && x.t === clean[p]);
          if (k === -1) { bad++; break; }
          pool[k].used = true; ans += pool[k].t;
        }
        if (W.normalizeAnswer(ans) !== W.normalizeAnswer(clean)) bad++;
      }
      if (bad === 0) R.letPass++; else R.letFail.push({ g, w, bad });
    }
  });

  render(words, R);
}

function render(words, R) {
  const totalFail = R.normFail.length + R.sylFail.length + R.letFail.length + R.accFail.length;
  const totalChecks = R.normPass + R.normFail.length
                    + R.sylPass  + R.sylFail.length
                    + R.letPass  + R.letFail.length
                    + R.accPass  + R.accFail.length;

  const groupCounts = {};
  words.forEach(x => groupCounts[x.g] = (groupCounts[x.g] || 0) + 1);

  let h = '';
  h += `<div class="verdict ${totalFail === 0 ? 'ok' : 'bad'}">`;
  h += totalFail === 0 ? '🎉 全部通過，零 Bug！' : `⚠️ 發現 ${totalFail} 個問題`;
  h += `</div>`;

  h += `<table>
    <tr><th>測試項目</th><th>檢查數</th><th>通過</th><th>失敗</th></tr>
    <tr><td>1️⃣ <code>normalizeAnswer</code> — 11 種真實輸入變體</td>
        <td>${R.normPass + R.normFail.length}</td>
        <td class="ok">${R.normPass}</td>
        <td class="${R.normFail.length ? 'bad' : 'ok'}">${R.normFail.length}</td></tr>
    <tr><td>2️⃣ <code>autoSplitSyllables</code> — 音節必須拼返原字</td>
        <td>${R.sylPass + R.sylFail.length}</td>
        <td class="ok">${R.sylPass}</td>
        <td class="${R.sylFail.length ? 'bad' : 'ok'}">${R.sylFail.length}</td></tr>
    <tr><td>3️⃣ Letters 關 — 每字 25 次隨機洗牌</td>
        <td>${R.letPass + R.letFail.length}</td>
        <td class="ok">${R.letPass}</td>
        <td class="${R.letFail.length ? 'bad' : 'ok'}">${R.letFail.length}</td></tr>
    <tr><td>4️⃣ 音節數準確度 — 對比權威字典</td>
        <td>${R.accPass + R.accFail.length}</td>
        <td class="ok">${R.accPass} (${(R.accPass/Math.max(1,R.accPass+R.accFail.length)*100).toFixed(1)}%)</td>
        <td class="${R.accFail.length ? 'bad' : 'ok'}">${R.accFail.length}</td></tr>
    <tr style="background:#fafafa;font-weight:700">
        <td>總計</td><td>${totalChecks}</td>
        <td class="ok">${totalChecks - totalFail}</td>
        <td class="${totalFail ? 'bad' : 'ok'}">${totalFail}</td></tr>
  </table>`;

  h += `<div class="section ok"><strong>測試字表：</strong>共 ${words.length} 個不重複單字<br>`;
  Object.entries(groupCounts).forEach(([g, n]) => { h += `&nbsp;• ${g}：${n} 字<br>`; });
  h += `</div>`;

  h += `<div class="section ok"><strong>11 種輸入變體：</strong><br>
        正常小階 · 全大階 · 首字母大階 · 全形 IME（中文鍵盤）· 前後空格 ·
        母音帶組合重音符 · 零寬字元 · 彎引號 · NBSP · 全形空格</div>`;

  if (R.normFail.length) {
    h += `<div class="section bad"><strong>❌ normalizeAnswer 失敗 (${R.normFail.length})</strong>`;
    R.normFail.slice(0, 60).forEach(f => {
      h += `<div class="row">[${f.g}] '${f.w}' (${f.label}) → 得到 '${f.got}'，應為 '${f.target}'</div>`;
    });
    if (R.normFail.length > 60) h += `<div class="row">… 另外 ${R.normFail.length - 60} 個</div>`;
    h += `</div>`;
  }

  if (R.sylFail.length) {
    h += `<div class="section bad"><strong>❌ 音節拆分失敗 (${R.sylFail.length})</strong>`;
    R.sylFail.slice(0, 60).forEach(f => {
      h += f.error
        ? `<div class="row">[${f.g}] '${f.w}' ERROR: ${f.error}</div>`
        : `<div class="row">[${f.g}] '${f.w}' → [${f.syls.join('|')}] 拼返='${f.rejoined}' 應為='${f.expected}'</div>`;
    });
    if (R.sylFail.length > 60) h += `<div class="row">… 另外 ${R.sylFail.length - 60} 個</div>`;
    h += `</div>`;
  }

  if (R.accFail.length) {
    h += `<div class="section bad"><strong>❌ 音節數不準 (${R.accFail.length})</strong>`;
    R.accFail.slice(0, 60).forEach(f => {
      h += `<div class="row">[${f.g}] '${f.w}' → [${f.syls.join('|')}] 拆成 ${f.got} 個，應為 ${f.exp} 個</div>`;
    });
    if (R.accFail.length > 60) h += `<div class="row">… 另外 ${R.accFail.length - 60} 個</div>`;
    h += `</div>`;
  }

  if (R.letFail.length) {
    h += `<div class="section bad"><strong>❌ Letters 洗牌失敗 (${R.letFail.length})</strong>`;
    R.letFail.slice(0, 60).forEach(f => {
      h += `<div class="row">[${f.g}] '${f.w}' — ${f.bad}/25 次洗牌失敗</div>`;
    });
    h += `</div>`;
  }

  if (R.sgfx && R.sgfx.length) {
    h += `<details><summary>ℹ️ syllableGroupsForWord 降級為整字 (${R.sgfx.length}) — 通常唔影響判對，只係少了音節拆分</summary>`;
    R.sgfx.slice(0, 80).forEach(f => {
      h += `<div class="row">[${f.g}] '${f.w}' → [${f.syls.join('|')}]</div>`;
    });
    h += `</details>`;
  }

  document.getElementById('summary').innerHTML = h;
  document.getElementById('summary').style.display = 'block';
  setStatus('');
  window.__RESULT__ = { words: words.length, totalChecks, totalFail, accPass: R.accPass, accFail: R.accFail.length, R };
}
</script>
</body>
</html>
